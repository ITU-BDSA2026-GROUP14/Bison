name: Request team review

on:
    pull_request:
        types: [opened]

permissions:
    contents: read
    pull-requests: write

jobs:
    request-team-review:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/github-script@v9
            with:
                script: |
                    try {
                        await github.rest.pulls.requestReviewers({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            pull_number: context.payload.pull_request.number,
                            team_reviewers: ['bison-devs'],
                        });
                    } catch (error) {
                        if (error.status === 404) {
                            core.warning(
                                "Could not request team review for 'bison-devs' (team not found or inaccessible). Skipping."
                            );
                            return;
                        }
                        throw error;
                    }