name: Label issues by title prefix

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;

            const rules = [
              { pattern: /^\s*bug\s*:/i,      label: 'bug' },
              { pattern: /^\s*feature\s*:/i,  label: 'feature' },
              { pattern: /^\s*refactor\s*:/i, label: 'refactor' },
              { pattern: /^\s*fix\s*:/i,    label: 'fix' },
            ];

            const existing = context.payload.issue.labels.map(l => l.name.toLowerCase());
            const labels = rules
              .filter(r => r.pattern.test(title))
              .map(r => r.label)
              .filter(l => !existing.includes(l));

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }
