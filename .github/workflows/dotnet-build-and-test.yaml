# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Setup Dafny
      uses: dafny-lang/setup-dafny-action@v1.9.1
      with:
        dafny-version: 4.11.0

    # Fails the build if the filter specification cannot be proven.
    - name: Verify Dafny code
      working-directory: src/Bison.Core/Dafny
      run: dafny verify Filter.dfy --allow-external-contracts

    # Regenerates Filter.cs from Filter.dfy so the tests always run the verified code.
    - name: Compile Dafny code to C#
      working-directory: src/Bison.Core/Dafny
      run: dafny translate cs Filter.dfy --allow-external-contracts

    - name: Restore dependencies
      run: dotnet restore Bison.sln
      
    - name: Build
      run: dotnet build Bison.sln --no-restore
      
    - name: Test
      run: |
            export GitHub__ClientId="${{ secrets.GITHUBCLIENTID }}"
            export GitHub__ClientSecret="${{ secrets.GITHUBCLIENTSECRET }}"
            dotnet test --no-build --verbosity normal
